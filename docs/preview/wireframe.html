<!doctype html><html lang="pt-BR" data-scroll-behavior="smooth"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wireframe navegável — prévia offline</title><style>:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --space-16: 64px;
  --color-bg: #fafaf9;
  --color-surface: #fff;
  --color-border: #e0dfda;
  --color-text: #262823;
  --color-muted: #60635b;
  --brand-sidebar: #262d29;
  --brand-access: #363f38;
  --brand-buy: #62544c;
  --brand-badge: #eee8e2;
  --font-display: Arial, Helvetica, sans-serif;
  --font-body: Arial, Helvetica, sans-serif;
  --radius-input: 8px;
  --radius-card: 12px;
  --radius-hero: 16px;
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font: 16px/1.5 var(--font-body);
}
a {
  color: inherit;
  text-decoration: none;
}
button,
input,
select {
  font: inherit;
}
button,
a,
input,
select,
summary {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
button:disabled,
input:disabled {
  cursor: not-allowed;
}
button:disabled {
  background: #eeefeb !important;
  color: #62665e !important;
  border-color: #d6d9d0 !important;
  box-shadow: none !important;
}
button:disabled:hover {
  transform: none;
}
a:focus-visible,
button:focus-visible,
input:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid #56735b;
  outline-offset: 4px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  font-family: var(--font-display);
  letter-spacing: -0.035em;
}
h1 {
  font-size: 32px;
  line-height: 1.25;
  font-weight: 700;
}
h2 {
  font-size: 24px;
  line-height: 1.33;
}
h3 {
  font-size: 18px;
  line-height: 1.45;
  font-weight: 600;
}
p {
  color: var(--color-muted);
}
img {
  max-width: 100%;
}
small,
.microcopy {
  font-size: 12px;
  line-height: 1.5;
  color: var(--color-muted);
}
input,
select {
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  border-radius: var(--radius-input);
  min-height: 48px;
  padding: 12px 14px;
  max-width: 100%;
  color: var(--color-text);
}
input::placeholder {
  color: #686b63;
}
input {
  width: 100%;
}
label {
  font-size: 14px;
  font-weight: 600;
}
code {
  font: 13px/1.5 monospace;
  overflow-wrap: anywhere;
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 48px;
  padding: 12px 22px;
  border: 1px solid var(--brand-access);
  border-radius: 999px;
  background: var(--brand-access);
  color: white;
  font-size: 14px;
  font-weight: 600;
  transition: background 0.15s;
}
.button:hover {
  filter: brightness(0.93);
}
.button.outline {
  background: transparent;
  color: var(--color-text);
  border-color: var(--color-border);
}
.button.buy {
  background: var(--brand-buy);
  border-color: var(--brand-buy);
}
.button-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.text-link {
  display: block;
  text-decoration: underline;
  text-underline-offset: 4px;
  margin-top: 16px;
  font-size: 14px;
  min-height: 44px;
  padding-top: 10px;
}
.eyebrow {
  display: block;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.5;
  letter-spacing: 0.13em;
  color: var(--color-muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.pill {
  padding: 6px 12px;
  border: 1px solid var(--color-border);
  border-radius: 99px;
  font-size: 12px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.skip-link {
  position: fixed;
  top: -100px;
  left: 16px;
  padding: 12px;
  background: #fff;
  z-index: 100;
}
.skip-link:focus {
  top: 16px;
}
.notice {
  padding: 16px;
  border: 1px solid var(--color-border);
  border-radius: 8px;
  background: #f2f1ec;
  color: #44483e;
  font-size: 14px;
  line-height: 1.6;
}
/* Shell */
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 240px;
  background: var(--brand-sidebar);
  color: #f5f5ef;
  padding: 32px 20px;
  display: flex;
  flex-direction: column;
  z-index: 30;
}
.wordmark {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.03em;
}
.brand-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border: 1px solid currentColor;
  border-radius: 50%;
  font-family: Georgia, serif;
  font-size: 27px;
  font-style: italic;
  font-weight: 400;
}
.wordmark-sub {
  display: block;
  font-size: 9px;
  letter-spacing: 0.17em;
  margin-top: 2px;
  font-weight: 400;
}
.nav-label {
  font-size: 10px;
  letter-spacing: 0.15em;
  color: #c1c8bd;
  margin: 32px 14px 16px;
  flex-shrink: 0;
}
.sidebar nav {
  display: grid;
  gap: 6px;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  align-content: start;
  overscroll-behavior: contain;
}
.sidebar nav a {
  min-height: 46px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  color: #dce1d8;
}
.sidebar nav a > span {
  font-size: 21px;
  width: 24px;
  text-align: center;
}
.sidebar nav a:hover {
  background: #ffffff0c;
}
.sidebar nav a[aria-current] {
  background: #eef0e5;
  color: #30372d;
  font-weight: 600;
}
.sidebar-bottom {
  flex-shrink: 0;
  margin-top: auto;
  padding: 32px 14px 0;
}
.sidebar-bottom p {
  font-size: 12px;
  color: #c1c8bd;
  line-height: 1.8;
}
.sidebar-bottom > a {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  border-top: 1px solid #ffffff30;
  margin-top: 24px;
  padding-top: 20px;
  min-height: 44px;
}
.workspace {
  margin-left: 240px;
  min-width: 0;
}
.desktop-topbar {
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--color-border);
  padding: 16px 40px;
  font-size: 13px;
  color: var(--color-muted);
}
.desktop-topbar > div {
  display: flex;
  gap: 24px;
  align-items: center;
}
.access-tag {
  font-size: 10px;
  letter-spacing: 0.14em;
}
.avatar {
  display: grid;
  place-items: center;
  border: 1px solid var(--color-border);
  background: #efefe9;
  border-radius: 50%;
  width: 44px;
  height: 44px;
  color: #42493c;
  font-size: 14px;
  font-weight: 600;
}
.main-content {
  max-width: 1184px;
  padding: 40px 32px 64px;
  margin: 0 auto;
  min-height: 70vh;
}
.page-heading {
  margin-bottom: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.page-heading p {
  margin-top: 10px;
  max-width: 640px;
}
.greeting {
  margin-bottom: 24px;
}
.edition {
  font-size: 9px;
  letter-spacing: 0.17em;
  color: var(--color-muted);
  border-bottom: 1px solid var(--color-border);
  padding-bottom: 8px;
  white-space: nowrap;
}
.mobile-header,
.bottom-nav,
.drawer {
  display: none;
}
.footer {
  border-top: 1px solid var(--color-border);
  display: flex;
  gap: 24px;
  justify-content: space-between;
  align-items: center;
  padding: 24px 32px;
  font-size: 11px;
  color: var(--color-muted);
}
.footer a {
  min-height: 44px;
  display: flex;
  align-items: center;
}
.section-block {
  margin-top: 64px;
}
.section-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}
.section-link {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 44px;
  font-size: 13px;
  white-space: nowrap;
  border-bottom: 1px solid var(--color-border);
}
.section-heading .eyebrow {
  font-size: 10px;
  margin-bottom: 8px;
}
/* Content slots, collections */
.asset-placeholder {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  justify-content: center;
  color: #535a4d;
  background: #e9eae3;
  border: 1px solid #d8dcd0;
  text-align: center;
  overflow: hidden;
  padding: 16px;
  font-size: 10px;
  letter-spacing: 0.04em;
  overflow-wrap: anywhere;
  position: relative;
}
.asset-placeholder:before {
  content: "";
  position: absolute;
  width: 70%;
  aspect-ratio: 1;
  border: 1px solid #d0d5c8;
  border-radius: 50%;
  opacity: 0.5;
}
.asset-placeholder > span {
  position: relative;
  z-index: 1;
}
.placeholder-symbol {
  font-size: 40px;
  line-height: 1;
  font-weight: 400;
}
.asset-placeholder.cover {
  aspect-ratio: 3/4;
  border-radius: 10px;
}
.asset-placeholder.wide {
  aspect-ratio: 16/7;
  border-radius: 12px;
}
.asset-placeholder.square {
  aspect-ratio: 1;
  border-radius: 8px;
}
.welcome-hero {
  background: #edeee7;
  border: 1px solid #e1e3d8;
  border-radius: 16px;
  min-height: 330px;
  padding: 32px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  position: relative;
  overflow: hidden;
}
.hero-copy {
  z-index: 1;
  align-self: center;
}
.hero-copy h2 {
  font-size: clamp(26px, 2.6vw, 40px);
  line-height: 1.15;
  letter-spacing: -0.045em;
  margin: 16px 0;
}
.hero-copy p {
  max-width: 320px;
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 24px;
}
.hero-copy .eyebrow {
  font-size: 10px;
}
.hero-copy .button {
  font-size: 12px;
}
.hero-collage {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 12px;
  padding-bottom: 22px;
  min-width: 0;
}
.hero-collage > .asset-placeholder {
  aspect-ratio: auto;
  min-height: 248px;
}
.hero-collage > div {
  display: grid;
  gap: 12px;
}
.hero-collage > div .asset-placeholder {
  aspect-ratio: auto;
  min-height: 112px;
  background: #e1e3d8;
}
.hero-caption {
  position: absolute;
  bottom: 18px;
  right: 32px;
  font-size: 10px;
  color: var(--color-muted);
}
.product-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}
.product-grid.carousel {
  grid-template-columns: repeat(5, minmax(0, 1fr));
}
.product-grid.carousel:has(> :nth-child(3):last-child) {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  max-width: 720px;
}
.product-card {
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}
.cover-link {
  display: block;
  margin-bottom: 16px;
  position: relative;
}
.product-card h3 {
  font-size: 16px;
  line-height: 1.4;
  letter-spacing: -0.02em;
  min-height: 45px;
  margin-bottom: 8px;
}
.product-card .eyebrow {
  font-size: 9px;
  letter-spacing: 0.1em;
}
.product-card .button {
  width: 100%;
  font-size: 12px;
  min-height: 44px;
  padding: 8px 12px;
  margin-top: auto;
}
.card-status {
  font-size: 11px;
  margin-bottom: 16px;
  line-height: 1.5;
}
.material-button {
  margin-top: 8px;
  padding: 8px;
  border: 1px solid var(--color-border);
  border-radius: 8px;
  font-size: 11px;
  min-height: 44px;
}
.lock-label {
  position: absolute;
  inset: auto 10px 10px;
  background: #fff;
  padding: 6px 10px;
  font-size: 11px;
  border-radius: 6px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}
.chips button {
  border: 1px solid var(--color-border);
  border-radius: 99px;
  background: transparent;
  color: var(--color-muted);
  padding: 10px 18px;
  font-size: 13px;
  min-height: 44px;
}
.chips button.selected {
  background: var(--brand-access);
  color: white;
  border-color: var(--brand-access);
}
.category-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}
.category-card {
  position: relative;
  min-width: 0;
}
.category-art {
  position: relative;
  aspect-ratio: 3/4;
  border-radius: 10px;
  background: #eae9e2;
  display: grid;
  place-items: center;
  overflow: hidden;
  margin-bottom: 16px;
}
.category-art > span:first-child {
  font-size: 90px;
  font-family: Georgia, serif;
  font-weight: 400;
  line-height: 1;
  color: #6a7262;
}
.category-art:after {
  content: "";
  position: absolute;
  inset: 24px;
  border: 1px solid #858d7c55;
  border-radius: 100px 100px 8px 8px;
}
.category-art.tone-1 {
  background: #e5e8e0;
}
.category-art.tone-2 {
  background: #e9e5df;
}
.category-art.tone-3 {
  background: #e2e6e2;
}
.category-index {
  position: absolute;
  top: 12px;
  left: 12px;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: #515a48;
}
.category-card h3 {
  font-size: 16px;
  letter-spacing: -0.02em;
  padding-right: 20px;
}
.category-card p {
  font-size: 11px;
  line-height: 1.5;
  margin-top: 4px;
}
.category-arrow {
  position: absolute;
  right: 2px;
  bottom: 24px;
}
.search-field {
  display: block;
  margin-bottom: 24px;
  max-width: 420px;
}
.search-field > span {
  display: block;
  font-size: 12px;
  margin-bottom: 6px;
}
.search-field input {
  background: transparent;
  font-size: 14px;
}
.stories-grid {
  display: grid;
  grid-template-columns: 7fr 5fr;
  gap: 28px;
}
.featured-story .asset-placeholder {
  aspect-ratio: 16/10;
}
.story-copy {
  padding-top: 20px;
}
.story-copy h3 {
  font-size: 24px;
  line-height: 1.25;
  max-width: 380px;
  margin-bottom: 12px;
}
.story-copy p {
  font-size: 14px;
  margin-bottom: 16px;
}
.story-meta {
  font-size: 11px;
  color: var(--color-muted);
}
.story-list {
  display: grid;
  align-content: start;
  gap: 24px;
}
.story-item {
  display: grid;
  grid-template-columns: 80px 1fr 12px;
  gap: 16px;
  align-items: center;
  border-bottom: 1px solid var(--color-border);
  padding-bottom: 24px;
}
.story-item:last-child {
  border-bottom: 0;
}
.story-item .asset-placeholder {
  padding: 8px;
  font-size: 8px;
}
.story-item .placeholder-symbol {
  font-size: 25px;
}
.story-item .eyebrow {
  font-size: 9px;
}
.story-item h3 {
  font-size: 15px;
  line-height: 1.5;
  letter-spacing: -0.015em;
  margin-bottom: 8px;
}
.community-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.community-quote {
  padding: 32px;
  background: #f0f0e9;
  border-radius: 12px;
}
.quote-mark {
  font:
    64px/0.8 Georgia,
    serif;
  color: #676e5f;
}
.community-quote h3 {
  font-size: 24px;
  margin: 12px 0;
}
.community-quote p {
  font-size: 14px;
  margin-bottom: 24px;
}
.community-grid > .asset-placeholder {
  aspect-ratio: auto;
}
.offers-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}
.offer-card {
  display: grid;
  grid-template-columns: 80px minmax(0, 1fr);
  gap: 16px;
  background: white;
  border: 1px solid var(--color-border);
  border-radius: 12px;
  padding: 16px;
  align-items: start;
}
.offer-card .asset-placeholder {
  padding: 8px;
  font-size: 8px;
}
.offer-card .placeholder-symbol {
  font-size: 24px;
}
.offer-badge {
  display: inline-block;
  background: var(--brand-badge);
  border-radius: 4px;
  padding: 4px 6px;
  font-size: 8px;
  font-weight: 700;
  color: #625045;
  margin-bottom: 12px;
}
.offer-card h3 {
  font-size: 14px;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}
.offer-card p:not(.price):not(.microcopy) {
  font-size: 11px;
  line-height: 1.6;
  margin-bottom: 16px;
}
.price {
  color: var(--color-text);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.04em;
}
.price s {
  font-size: 10px;
  font-weight: 400;
  color: var(--color-muted);
  white-space: nowrap;
}
.offer-card .button {
  width: 100%;
  padding: 8px;
  font-size: 11px;
  min-height: 44px;
  margin: 12px 0 4px;
}
.offer-note {
  margin-top: 24px;
}
.newsletter {
  margin-top: 64px;
  padding: 48px 32px;
  background: #e8eae2;
  border-radius: 12px;
  text-align: center;
  border: 1px solid #dde0d3;
}
.newsletter h2 {
  font-size: 32px;
  line-height: 1.2;
  margin-bottom: 16px;
}
.newsletter p {
  font-size: 14px;
  max-width: 380px;
  margin: 0 auto 24px;
}
.newsletter-form {
  display: flex;
  gap: 8px;
  max-width: 440px;
  margin: 0 auto 16px;
}
.newsletter-form input {
  background: #f6f7f1;
  min-width: 0;
}
.newsletter-form button {
  white-space: nowrap;
}
.newsletter small {
  font-size: 10px;
}
/* Product, module and auxiliary pages */
.breadcrumb {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--color-muted);
  margin-bottom: 24px;
}
.breadcrumb a {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  text-decoration: underline;
  text-underline-offset: 4px;
}
.product-header {
  display: grid;
  grid-template-columns: 180px minmax(0, 1fr);
  gap: 32px;
  margin-bottom: 40px;
  align-items: center;
}
.product-header p {
  max-width: 560px;
  margin-top: 12px;
}
.product-header .button {
  margin-top: 24px;
}
.progress-label {
  font-size: 12px;
}
.progress-track {
  width: 240px;
  max-width: 100%;
  height: 5px;
  background: #e0e4d9;
  border-radius: 4px;
  margin-top: 12px;
}
.tabs {
  display: flex;
  gap: 24px;
  border-bottom: 1px solid var(--color-border);
  margin-bottom: 24px;
}
.tabs button {
  min-height: 48px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--color-muted);
  padding: 12px 4px;
  font-size: 14px;
}
.tabs button[aria-selected="true"] {
  border-color: var(--brand-access);
  color: var(--color-text);
  font-weight: 600;
}
.module-list {
  border: 1px solid var(--color-border);
  border-radius: 12px;
  background: white;
  overflow: hidden;
}
.module-row {
  min-height: 80px;
  padding: 16px 20px;
  display: flex;
  gap: 20px;
  align-items: center;
  border-bottom: 1px solid var(--color-border);
}
.module-row:last-child {
  border: 0;
}
.module-row:hover {
  background: #f3f4ee;

/* Review iteration: contain editorial media; animate only the image layer. */
:root {
  --selection-surface: #d0d8ef;
  --selection-bar: #722f46;
  --activity-1: #eee4e9;
  --activity-2: #d4acbc;
  --activity-3: #ab6782;
  --activity-4: #722f46;
}
html[data-preview-accent="olive"] {
  --selection-surface: #eef0df;
  --selection-bar: #68713d;
  --activity-1: #eff0e3;
  --activity-2: #cdd2ab;
  --activity-3: #9ea466;
  --activity-4: #68713d;
}
html[data-preview-accent="beige"] {
  --selection-surface: #f3ece3;
  --selection-bar: #806345;
  --activity-1: #f3ece3;
  --activity-2: #e1ceb8;
  --activity-3: #b79b7c;
  --activity-4: #806345;
}
.sidebar nav a[aria-current],
.drawer nav a[aria-current] {
  background: var(--selection-surface);
  box-shadow: inset 3px 0 var(--selection-bar);
}
.sidebar nav a > .nav-item-title {
  width: auto;
  text-align: left;
  font-size: 14px;
}
.nav-item-title small {
  display: block;
  font-size: 10px;
  font-weight: 400;
}
.sidebar nav a:nth-child(4),
.drawer nav a:nth-child(4) {
  margin-top: 0;
}
.sidebar nav a:nth-child(5),
.drawer nav a:nth-child(5) {
  margin-top: 20px;
}
.stories-grid {
  grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
}
.stories-grid > *,
.story-item > *,
.editorial-grid > * {
  min-width: 0;
}
.featured-story,
.editorial-card {
  display: block;
  min-width: 0;
  overflow-wrap: anywhere;
}
.featured-story:hover,
.story-item:hover {
  box-shadow: none;
}
.story-media {
  position: relative;
  min-width: 0;
  overflow: hidden;
  isolation: isolate;
  border-radius: 16px;
  background: #e9eae3;
  aspect-ratio: 16 / 10;
}
.story-media > .asset-placeholder {
  width: 100%;
  height: 100%;
  aspect-ratio: auto;
  border-radius: inherit;
  transform: scale(1);
  transition: transform 260ms ease;
}
.featured-story:hover .story-media > .asset-placeholder,
.featured-story:focus-visible .story-media > .asset-placeholder,
.story-item:hover .story-media > .asset-placeholder,
.editorial-card:hover .story-media > .asset-placeholder {
  transform: scale(1.045);
}
.story-copy {
  padding-top: 24px;
}
.story-item {
  grid-template-columns: 72px minmax(0, 1fr) 12px;
  gap: 16px;
}
.story-item .story-media {
  width: 72px;
  aspect-ratio: 1;
  border-radius: 12px;
}
.story-item h3 {
  overflow-wrap: anywhere;
}
.editorial-card > .story-media {
  margin-bottom: 24px;
}
.offer-badge {
  border-radius: 999px;
  padding: 6px 12px;
}
.offer-card .microcopy {

.cover-link.locked-cover {
  position: relative;

  place-items: center;
  aspect-ratio: 3 / 4;
  border-radius: 16px;
  background: linear-gradient(145deg, #363b35, #171c19);
  color: #fff;
  overflow: hidden;
}

  content: "";
  position: absolute;
  width: 180%;
  height: 1px;
  background: #ffffff12;
  transform: rotate(-35deg);
}
.cover-lock {
  display: grid;
  place-items: center;

  height: 64px;

.activity-panel,

.theme-choice[aria-pressed="true"],
.accent-choice[aria-pressed="true"] {
  border: 2px solid var(--selection-bar);
  padding: 7px 15px;
}
.theme-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1px solid #9b9d9f;
}
.light-dot {
  background: #fff;
}
.dark-dot {
  background: #202120;
}
.olive-dot {
  background: #9ea466;
}
.wine-dot {
  background: #722f46;
}
.beige-dot {
  background: #d7c5ad;
}
.rewards-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin-top: 24px;
}
.reward-card {
  min-width: 0;
  padding: 20px;
  border: 1px solid var(--color-border);
  border-radius: 16px;
}
.reward-symbol {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  margin-bottom: 16px;
  border-radius: 12px;
  color: var(--selection-bar);
  background: var(--selection-surface);
  font-size: 27px;
}
.reward-card h3 {
  font-size: 16px;
  margin-bottom: 8px;
}
.reward-card p {
  font-size: 14px;
  margin-bottom: 12px;
}
.reward-card small {
  font-size: 11px;
}
.crown-preview {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  margin-top: 24px;
}
.crown-preview p {
  font-size: 14px;
}
.avatar {
  position: relative;
}
.profile-crown {
  position: absolute;
  display: grid;
  place-items: center;
  top: -10px;
  right: -8px;
  width: 26px;
  height: 26px;
  border: 1px solid #dccb9d;
  border-radius: 50%;
  background: #fff6dc;
  color: #7c5c1c;
}
.profile-crown svg {
  width: 18px;
  height: 18px;
}
.future-notice {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px;
  margin-bottom: 24px;
  border: 1px solid var(--color-border);
  border-radius: 12px;
}
.future-notice .pill {
  white-space: nowrap;
  background: var(--selection-surface);
  color: var(--selection-bar);
  border: 0;
}
.future-notice p {
  font-size: 13px;
}
.ai-studio {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 32px;
  padding: 40px 24px;
  align-items: center;
}
.ai-orb-stage {
  display: grid;
  justify-items: center;
  gap: 32px;
  padding: 32px 0;
}
.ai-orb {
  position: relative;
  width: min(250px, 100%);
  aspect-ratio: 1;
  perspective: 800px;
}
.ai-orb-core {
  position: absolute;
  inset: 16px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 28% 22%,
    #fff 0%,
    #d0d8ef 22%,
    #9ea466 52%,
    #722f46 83%,
    #2d2d2d 100%
  );
  box-shadow:
    inset -18px -18px 32px #2d2d2d32,
    inset 12px 12px 28px #ffffffb0,
    0 24px 50px -18px #722f4645;
}
.ai-orb-core::after {
  content: "";
  position: absolute;
  inset: -8px;
  border-radius: inherit;
  background: conic-gradient(
    from 30deg,
    transparent 0 40%,
    #ffffffb0 50%,
    transparent 60%
  );
  animation: orb-spin 16s linear infinite;
  mix-blend-mode: soft-light;
}
.ai-orbit {
  position: absolute;
  inset: -8px;
  border: 1px solid #9ea46690;
  border-radius: 50%;
  transform: rotateX(65deg) rotate(-25deg);
}
.ai-orbit-two {
  inset: -20px;
  border-color: #722f4640;
  transform: rotateY(60deg) rotate(35deg);
}
.ai-orb-spark {
  position: absolute;
  inset: -8px;
  animation: orb-spin 14s linear infinite;
}
.ai-orb-spark::after {
  content: "";
  position: absolute;
  top: 35px;
  left: 28px;
  width: 10px;
  height: 10px;
  background: #722f46;
  border-radius: 50%;
  box-shadow: 0 0 0 5px #722f4610;
}
.orb-caption {
  font-size: 10px;
  color: var(--color-muted);
  letter-spacing: 0.18em;
}
.ai-studio h1 {
  font:
    42px/1.1 Georgia,
    serif;
  letter-spacing: -0.035em;
  margin: 16px 0 24px;
}
.ai-studio-copy p {
  font-size: 16px;
  line-height: 1.7;
  margin-bottom: 24px;
}
.ai-studio-copy small {
  display: block;
  margin-top: 16px;
  font-size: 11px;
}
.ai-steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;
  padding-top: 32px;
  border-top: 1px solid var(--color-border);
}
.ai-steps article > span {
  font-size: 12px;
  color: var(--selection-bar);
}
.ai-steps h2 {
  font-size: 17px;
  margin: 12px 0 8px;
}
.ai-steps p {
  font-size: 14px;
}
@keyframes orb-spin {
  to {
    transform: rotate(360deg);
  }
}
html[data-preview-mode="dark"] {
  color-scheme: dark;
  --color-text: #f3f1ed;
  --color-muted: #b6b8bd;
  --color-border: #444444;
  --color-surface: #202020;
  --color-bg-canvas: linear-gradient(165deg, #151515, #1d1d1d 42%, #242220);
  --selection-surface: #3c3038;
  --selection-bar: #d9a0b5;
}
html[data-preview-mode="dark"][data-preview-accent="olive"] {
  --selection-surface: #333b2a;
  --selection-bar: #c2c889;
}
html[data-preview-mode="dark"][data-preview-accent="beige"] {
  --selection-surface: #3b342b;
  --selection-bar: #d7c5ad;
}
html[data-preview-mode="dark"]
  :is(
    .sidebar,
    .desktop-topbar,
    .mobile-header,
    .main-content:not(.home-content),
    .home-zone,
    .product-card,
    .offer-card,
    .account-panel,
    .support-card,
    .state-panel,
    .access-card,
    .drawer,
    .footer,
    .newsletter.newsletter-strip,
    .module-list,
    .locked-product,
    .viewer-placeholder,
    .notice,
    #offline-toolbar
  ) {
  background: var(--color-surface);
  color: var(--color-text);
  border-color: var(--color-border);
}
html[data-preview-mode="dark"]
  :is(.sidebar nav a, .drawer nav a, .bottom-nav a, .bottom-nav button) {
  color: var(--color-text);
}
html[data-preview-mode="dark"]
  :is(.sidebar .nav-label, .sidebar-bottom p, .gallery-toolbar strong span) {
  color: var(--color-muted);
}
html[data-preview-mode="dark"] :is(.sidebar nav a:hover, .drawer nav a:hover) {
  background: #303030;
}
html[data-preview-mode="dark"]
  :is(.sidebar nav a[aria-current], .drawer nav a[aria-current]) {
  background: var(--selection-surface);
}
html[data-preview-mode="dark"]
  :is(
    .asset-placeholder,
    .story-media,
    .category-art,
    .avatar,
    .learning-next-icon
  ) {
  background: #303030;
  color: #d9ddd5;
  border-color: #485343;
}
html[data-preview-mode="dark"] .learning-next {
  background: var(--color-surface);
}
html[data-preview-mode="dark"] .access-wrap {
  background: radial-gradient(ellipse at top, #30342a, transparent 65%);
}
html[data-preview-mode="dark"] .module-row:hover {
  background: #303030;
}
html[data-preview-mode="dark"]
  :is(.module-tag, .progress-track, .state-icon, .access-icon) {
  background: #353535;
  color: var(--color-text);
  border-color: var(--color-border);
}
html[data-preview-mode="dark"] .viewer-placeholder code {
  color: var(--color-muted);
}
html[data-preview-mode="dark"]
  :is(input, select, #offline-toolbar select, .account-panel input) {
  background: #292929;
  color: var(--color-text);
  border-color: var(--color-border);
}
html[data-preview-mode="dark"] input::placeholder {
  color: #b6b8bd;
}
html[data-preview-mode="dark"] button:disabled {
  background: #353535 !important;
  color: #c7cbc5 !important;
  border-color: #535353 !important;
}
html[data-preview-mode="dark"] .preview-banner {
  background: linear-gradient(110deg, #30312a, #263026);
  border-color: var(--color-border);
}
html[data-preview-mode="dark"] .banner-art {
  color: #c2c889;
}
html[data-preview-mode="dark"] .offer-badge {
  background: #3e352c;
  color: #e9d6c0;
}
html[data-preview-mode="dark"] .activity-cell.level-0 {
  background: #363636;
}
html[data-preview-mode="dark"] .activity-cell.level-1 {
  background: #55434c;
}
html[data-preview-mode="dark"][data-preview-accent="olive"]
  .activity-cell.level-1 {
  background: #4c553b;
}
html[data-preview-mode="dark"][data-preview-accent="beige"]
  .activity-cell.level-1 {
  background: #554b3f;
}
@media (max-width: 1200px) {
  .locked-product {
    grid-template-columns: minmax(0, 1fr);
    gap: 24px;
    padding: 24px;
  }
  .locked-product > .asset-placeholder {
    width: 120px;
  }
  .locked-product > div {
    min-width: 0;
  }
  .account-overview {
    grid-template-columns: minmax(0, 1fr);
  }
  .rewards-grid {
    grid-template-columns: minmax(0, 1fr);
  }
  .preview-banner {
    grid-template-columns: minmax(0, 1fr) 110px;
    padding: 24px;
  }
  .banner-art {
    width: 100px;
    height: 100px;
  }
  .ai-studio {
    gap: 24px;
    padding: 32px 0;
  }
  .ai-studio h1 {
    font-size: 34px;
  }
  .ai-orb {
    width: 190px;
  }
}
@media (max-width: 767px) {
  .stories-grid {
    display: flex;
  }
  .story-media {
    aspect-ratio: 16 / 10;
  }
  .story-item {
    grid-template-columns: 64px minmax(0, 1fr) 12px;
    gap: 16px;
  }
  .story-item .story-media {
    width: 64px;
  }
  .story-copy {
    padding-top: 24px;
  }
  .preview-banner {
    grid-template-columns: minmax(0, 1fr);
    padding: 24px 16px;
    margin-bottom: 24px;
  }
  .preview-banner h2 {
    font-size: 28px;
  }
  .preview-banner .banner-art {
    display: none;
  }
  .activity-panel,
  .personalization-card,
  .rewards-section {
    padding: 16px;
  }
  .settings-heading {
    flex-wrap: wrap;
  }
  .crown-preview {
    flex-direction: column;
    align-items: stretch;
  }
  .activity-map {
    grid-template-rows: repeat(7, 12px);
    gap: 4px;
  }
  .activity-map .activity-cell {
    height: 12px;
  }
  .appearance-choices {
    gap: 8px;
  }
  .accent-choice,
  .theme-choice {
    padding: 8px 12px;
    font-size: 12px;
    gap: 8px;
  }
  .accent-choice[aria-pressed="true"],
  .theme-choice[aria-pressed="true"] {
    padding: 7px 11px;
  }
  .bottom-nav a[aria-current],
  .bottom-nav button[aria-current],
  .bottom-nav button[aria-expanded="true"] {
    background: var(--selection-surface);
    box-shadow: inset 3px 0 var(--selection-bar);
  }
  html[data-preview-mode="dark"] .bottom-nav {
    background: var(--color-surface);
  }
  .future-notice {
    align-items: flex-start;
    gap: 12px;
  }
  .ai-studio {
    grid-template-columns: minmax(0, 1fr);
    padding: 16px 0 32px;
    gap: 16px;
  }
  .ai-orb-stage {
    padding: 32px 0 16px;
  }
  .ai-studio h1 {
    font-size: 34px;
  }
  .ai-studio .button {
    width: 100%;
  }
  .ai-steps {
    grid-template-columns: minmax(0, 1fr);
    gap: 24px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .story-media > .asset-placeholder {
    transition: none;
  }
  .featured-story:hover .story-media > .asset-placeholder,
  .featured-story:focus-visible .story-media > .asset-placeholder,
  .story-item:hover .story-media > .asset-placeholder,
  .editorial-card:hover .story-media > .asset-placeholder {
    transform: none;
  }
  .ai-orb-core::after,
  .ai-orb-spark {
    animation: none;
  }
}

  const parsed = new URL(url, "https://offline.invalid");
  const query = new URLSearchParams();
  for (const key of [
    "screen",
    "state",
    "product",
    "module",
    "post",
    "category",
  ]) {
    const value = parsed.searchParams.get(key);
    if (value && !(key === "state" && value === "normal"))
      query.set(key, value);
  }
  if (!query.has("screen")) query.set("screen", "home");
  query.sort();
  return query.toString();
}

function setBarHeight() {
  document.documentElement.style.setProperty(
    "--offline-bar-height",
    document.getElementById("offline-toolbar").offsetHeight + "px",
  );
}

function applyAppearance() {
  document.documentElement.dataset.previewMode = appearance.mode;
  document.documentElement.dataset.previewAccent = appearance.accent;
  view.querySelectorAll("button[data-mode]").forEach((button) => {
    button.setAttribute(
      "aria-pressed",
      String(button.dataset.mode === appearance.mode),
    );
  });
  view.querySelectorAll("button[data-accent]").forEach((button) => {
    button.setAttribute(
      "aria-pressed",
      String(button.dataset.accent === appearance.accent),
    );
  });
  view.querySelectorAll(".avatar").forEach((avatar) => {
    avatar.querySelector(".profile-crown")?.remove();
    if (appearance.crown) {
      const crown = document.createElement("span");
      crown.className = "profile-crown";
      crown.setAttribute("aria-hidden", "true");
      crown.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m3 7 5 4 4-7 4 7 5-4-2 12H5L3 7Z"/><path d="M6 22h12"/></svg>';
      avatar.append(crown);
    }
  });
  const crownButton = view.querySelector('[data-action="crown"]');
  if (crownButton) {
    crownButton.setAttribute("aria-pressed", String(appearance.crown));
    crownButton.textContent = appearance.crown
      ? "Ocultar coroa de exemplo"
      : "Ver coroa no perfil";
  }
}

function closeMenu() {
  const drawer = document.getElementById("more-navigation");
  if (!drawer) return;
  drawer.remove();
  const trigger = view.querySelector('button[aria-label="Mais opções"]');
  trigger?.setAttribute("aria-expanded", "false");
  trigger?.focus();
}

function render() {
  const requested = keyOf("/wireframes?" + location.hash.slice(1));
  const key = snapshots[requested] ? requested : "screen=home";
  view.innerHTML = snapshots[key];
  view.dataset.previewKey = key;
  view.querySelectorAll('a[href^="/wireframes"]').forEach((link) => {
    link.setAttribute("href", "#" + keyOf(link.getAttribute("href")));
  });
  const select = document.getElementById("screen-select");
  select.value = [...select.options].some((option) => option.value === key)
    ? key
    : "";
  applyAppearance();
  setBarHeight();
  window.scrollTo({ top: 0, behavior: "instant" });
}

document.getElementById("screen-select").addEventListener("change", (event) => {
  location.hash = event.target.value;
});
window.addEventListener("hashchange", render);
window.addEventListener("resize", setBarHeight);
document.addEventListener("submit", (event) => event.preventDefault());
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  const options = document.getElementById("appearance-options");
  if (options && !options.hidden) {
    options.hidden = true;
    const trigger = view.querySelector('[data-action="appearance"]');
    trigger?.setAttribute("aria-expanded", "false");
    trigger?.focus();
  } else closeMenu();
});
document.addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (button?.disabled) return;
  if (button?.dataset.action === "appearance") {
    const options = document.getElementById("appearance-options");
    options.hidden = !options.hidden;
    button.setAttribute("aria-expanded", String(!options.hidden));
    if (!options.hidden) options.querySelector("button")?.focus();
    return;
  }
  if (button?.dataset.mode || button?.dataset.accent) {
    if (["light", "dark"].includes(button.dataset.mode))
      appearance.mode = button.dataset.mode;
    if (["olive", "wine", "beige"].includes(button.dataset.accent))
      appearance.accent = button.dataset.accent;
    applyAppearance();
    document.getElementById("appearance-status").textContent =
      "Preferência aplicada apenas nesta prévia; não é salva na conta.";
    return;
  }
  if (button?.dataset.action === "crown") {
    appearance.crown = !appearance.crown;
    applyAppearance();
    return;
  }
  if (button?.getAttribute("aria-label") === "Mais opções") {
    if (document.getElementById("more-navigation")) return closeMenu();
    const drawer = document.createElement("div");
    drawer.className = "drawer";
    drawer.id = "more-navigation";
    drawer.setAttribute("role", "dialog");
    drawer.setAttribute("aria-label", "Mais opções");
    const close = document.createElement("button");
    close.type = "button";
    close.textContent = "Fechar";
    close.setAttribute("aria-label", "Fechar opções");
    close.className = "button outline";
    drawer.append(close);
    const nav = view.querySelector(".sidebar nav")?.cloneNode(true);
    if (nav) {
      nav.setAttribute("aria-label", "Mais opções");
      drawer.append(nav);
    }
    view.append(drawer);
    button.setAttribute("aria-expanded", "true");
    close.focus();
    return;
  }
  if (button?.getAttribute("aria-label") === "Fechar opções")
    return closeMenu();
  const link = event.target.closest("a");
  if (link?.getAttribute("href") === "#main") {
    event.preventDefault();
    const main = document.getElementById("main");
    main?.setAttribute("tabindex", "-1");
    main?.focus();
    main?.scrollIntoView();
  } else if (link?.getAttribute("href")?.startsWith("#screen=")) {
    closeMenu();
  } else if (link?.getAttribute("href")?.startsWith("/")) {
    event.preventDefault();
    location.hash = "screen=home";
  }
});
render();
</script></body></html>
